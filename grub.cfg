set timeout=0
set default=0

# Milestone 40. Boot the disk's copy when there is one, this disc's
# otherwise.
#
# `update apply` downloads a new kernel and initrd, verifies both, writes
# them to the FAT32 volume at /boot, and writes a `version` file *last*.
# That ordering is what makes this safe to test here: the marker exists
# only when both images beside it are complete, so a power cut during a
# download leaves no marker and this falls back to the disc.
#
# GRUB reads FAT32 natively, so nothing has to be installed on the disk
# for this to work - the disc stays the thing that boots, and the disk
# holds what it boots *into*. That is the difference between an OS that
# can update itself and one that has to be re-imaged.
#
# `search --file` rather than a hardcoded (hd0): with a disc in the
# machine, which device is which is the firmware's decision. The `if`
# matters as much - a bare `search` that fails would drop to the menu on
# a machine with no disk, which with timeout=0 is a machine that appears
# to hang.
menuentry "Novaris" {
    if search --no-floppy --file --set=root /boot/version; then
        echo "Booting the updated Novaris from disk."
    fi
    multiboot /boot/novaris.bin
    module /boot/initrd.img
    boot
}
