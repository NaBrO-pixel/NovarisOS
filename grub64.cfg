set timeout=0
set default=0

# The 64-bit bring-up disc. No `module` line yet: the initrd is loaded by
# code that has not been ported across, and a module GRUB loads but nothing
# reads is a way to make a boot failure look like a loader failure.
#
# `multiboot`, not `multiboot2`: the header in boot64.s is still Multiboot 1,
# so GRUB enters in 32-bit protected mode with paging off and the kernel
# makes the switch to long mode itself. Nothing about a 64-bit kernel
# requires Multiboot 2 - it only changes who does the switching.
menuentry "Novaris (x86-64)" {
    multiboot /boot/novaris64.bin
    boot
}
